name: Build Launcher

# Se déclenche quand tu pousses un tag de version (ex : v0.1.0), ou à la main
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # requis pour publier la Release

jobs:
  # 1) Chaque OS BUILD son installeur SANS publier (donc aucune course pour créer la release).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Builder (sans publier)
        run: npx electron-builder --publish never
        env:
          # Pas de certificat de signature -> on désactive la signature auto (macOS)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Récupérer les fichiers construits
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  # 2) UN SEUL job rassemble tout et publie la release (impossible d'avoir un conflit).
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger tous les fichiers construits
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Créer la release + déposer les fichiers + marquer « Latest »
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            || gh release create "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" \
                 --title "${{ github.ref_name }}" \
                 --notes "Mise à jour ${{ github.ref_name }}"
          find artifacts -type f -print0 | xargs -0 gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber
          gh release edit "${{ github.ref_name }}" --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
