name: Build Launcher

# Se déclenche quand tu pousses un tag de version (ex : v0.1.0), ou à la main
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # requis pour publier la Release

jobs:
  # 1) On crée la Release UNE SEULE FOIS, avant les builds.
  #    Comme ça les 3 OS ne se battent plus pour la créer en même temps.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Créer la release si elle n'existe pas
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            || gh release create "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" \
                 --title "${{ github.ref_name }}" \
                 --notes "Mise à jour ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Chaque OS build et dépose SON fichier dans la release déjà créée.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Builder et publier
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de certificat de signature -> on désactive la signature auto (macOS)
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # 3) Marque automatiquement la nouvelle version comme « Latest »
  set-latest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit "${{ github.ref_name }}" --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
