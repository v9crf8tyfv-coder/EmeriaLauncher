<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <link rel="stylesheet" href="style.css" />
    <title>EmeriaMC</title>
  </head>
  <body>
    <div class="bg"></div>

    <header>
      <button id="settings-btn" class="icon-btn" title="Réglages">⚙</button>
      <div class="brand">EmeriaMC</div>
      <button id="login" class="login-pill">
        <span class="dot"></span>
        <img id="head" class="head" alt="" hidden />
        <span id="login-label">Se connecter</span>
      </button>
      <div id="account-menu" class="account-menu" hidden>
        <button id="logout-btn" class="menu-item">Se déconnecter</button>
      </div>
    </header>

    <main>
      <button id="play" class="play-btn" disabled>LANCER</button>
      <div id="status" class="status">Connecte-toi pour jouer</div>
    </main>

    <!-- Panneau Réglages (tiroir gauche) -->
    <div id="settings" class="overlay">
      <aside class="drawer">
        <div class="drawer-head">
          <h2>Réglages</h2>
          <button id="settings-close" class="icon-btn">✕</button>
        </div>

        <nav class="cats">
          <button class="cat active" data-tab="ram">RAM</button>
          <button class="cat" data-tab="mods">Mods</button>
          <button class="cat" data-tab="shaders">Shaders</button>
        </nav>

        <div class="cat-body">
          <div class="tab-content" id="tab-ram">
            <label>Mémoire · <b id="ram-val">4</b> Go</label>
            <input id="ram" type="range" min="2" max="8" step="1" value="4" />
            <div class="hint" id="ram-max-hint"></div>
          </div>

          <div class="tab-content" id="tab-mods" hidden>
            <div id="mods-list" class="list"></div>
          </div>

          <div class="tab-content" id="tab-shaders" hidden>
            <label class="toggle-row">
              <input type="checkbox" id="shader-toggle" checked />
              <span>Activer les shaders</span>
            </label>
            <div id="shaders-list" class="list"></div>
          </div>

          <button id="send-logs" class="ghost-btn">Envoyer les logs (problème ?)</button>
        </div>
      </aside>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
