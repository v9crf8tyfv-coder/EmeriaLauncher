<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Console Emeria</title>
<style>
  :root{ --bg:#0a0a0c; --fg:#cfd2d6; --dim:#6a6f78; --acc:#7c5cff; --line:#1c1d22; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--fg);
        font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
        font-size:13px; line-height:1.55; display:flex; flex-direction:column; }
  .top{ flex:0 0 auto; border-bottom:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:#0d0d10; }
  .title{ font-weight:700; letter-spacing:.5px; color:#fff; }
  .title b{ color:var(--acc); }
  .meta{ color:var(--dim); font-size:12px; }
  .prompt{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .prompt span{ color:var(--acc); }
  input{ background:#111217; border:1px solid var(--line); color:var(--fg); font:inherit;
         padding:5px 9px; border-radius:4px; outline:none; width:230px; }
  input:focus{ border-color:var(--acc); }
  .console{ flex:1 1 auto; overflow-y:auto; padding:10px 14px 40px; white-space:pre-wrap; word-break:break-word; }
  .ln{ padding:1px 0; }
  .ln:hover{ background:rgba(255,255,255,.03); }
  .t{ color:var(--dim); }
  .cat{ font-weight:700; }
  .who{ color:#e8e8ec; font-weight:600; }
  .msg{ color:#b9bcc2; }
  .info{ color:var(--dim); padding:14px; }
  .err{ color:#ff6b6b; padding:14px; }
  /* scrollbar discrète */
  .console::-webkit-scrollbar{ width:10px; }
  .console::-webkit-scrollbar-thumb{ background:#23242b; border-radius:6px; }
</style>
</head>
<body>
  <div class="top">
    <span class="title">EMERIA <b>CONSOLE</b></span>
    <span class="meta" id="meta">chargement…</span>
    <span class="prompt"><span>&gt;</span><input id="f" type="text" placeholder="filtrer (joueur, texte, CAT)" autocomplete="off" spellcheck="false" /></span>
  </div>
  <div class="console" id="c"><div class="info">Connexion au flux…</div></div>

<script>
(function(){
  var BYTEBIN='https://bytebin.lucko.me/';
  var COL={ MORT:'#ff5f5f', ARGENT:'#5fd75f', EVENT:'#ffcf5f', REMBOURSEMENT:'#b58cff',
            PANNEAU:'#5fafff', CONNEXION:'#7a7f88', INVDEAD:'#ffa05f', MARKET:'#5fd7d7',
            TROC:'#5fd7d7', PVP:'#ff8f8f', SANCTION:'#ff5f87' };
  var c=document.getElementById('c'), meta=document.getElementById('meta'), f=document.getElementById('f');
  var DATA=null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[x];}); }
  function p2(n){ return (n<10?'0':'')+n; }
  function stamp(ms){ var d=new Date(ms); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }

  var key=(location.hash||'').replace(/^#/,'').trim();
  if(!key){ c.innerHTML='<div class="err">Clé manquante. Refais /emerialogs en jeu.</div>'; meta.textContent=''; return; }

  fetch(BYTEBIN+encodeURIComponent(key))
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ DATA=d; init(); })
    .catch(function(e){ meta.textContent=''; c.innerHTML='<div class="err">Lien expiré ou illisible ('+esc(e.message)+'). Refais /emerialogs.</div>'; });

  function init(){
    var n=(DATA.entries||[]).length;
    meta.textContent=DATA.viewer+' · niveau '+DATA.level+' · '+n+' lignes · '+stamp(DATA.generated);
    (DATA.entries||[]).sort(function(a,b){ return a.t-b.t; }); // chronologique (console)
    f.oninput=draw;
    draw(true);
  }

  function draw(scroll){
    var q=f.value.trim().toLowerCase();
    var rows=(DATA.entries||[]).filter(function(e){
      if(!q) return true;
      return (((e.w||'')+' '+(e.d||'')+' '+(e.c||'')).toLowerCase().indexOf(q)>=0);
    });
    if(!rows.length){ c.innerHTML='<div class="info">— aucune ligne —</div>'; return; }
    var h='';
    for(var i=0;i<rows.length;i++){
      var e=rows[i], col=COL[e.c]||'#9aa0aa';
      h+='<div class="ln"><span class="t">['+stamp(e.t)+']</span> '
        +'<span class="cat" style="color:'+col+'">['+esc(e.c)+']</span> '
        +'<span class="who">'+esc(e.w)+'</span> '
        +'<span class="msg">'+esc(e.d)+'</span></div>';
    }
    c.innerHTML=h;
    if(scroll) c.scrollTop=c.scrollHeight; // tail : on va en bas (plus récent)
  }

  window.addEventListener('hashchange',function(){ location.reload(); });
})();
</script>
</body>
</html>
